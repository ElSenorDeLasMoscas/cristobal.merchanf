
project:
  type: website
  output-dir: docs
  # Solo las páginas .qmd son el sitio. Sin esta lista, Quarto renderiza
  # también los .md operativos (GUIA_GITHUB, LOG, README_PERSONALIZACION)
  # y los publica en docs/, aunque el .gitignore excluya sus fuentes.
  render:
    - "*.qmd"
  resources:
    - data/


website:
  title: "cristobal.merchanf"
  favicon: data/img/favicon.png
  navbar:
    background: light
    foreground: dark
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Lecturas"
        href: lecturas.qmd
      - text: "Ensayos"
        href: ensayos.qmd
      - text: "Scripts"
        href: scripts.qmd
      - text: "Recursos"
        href: recursos.qmd
      - text: "Explorar"
        href: explorar.qmd

  page-footer:
    left: |
      © 2026 Cristóbal Merchan Farfán, Chile.<br>
      <i class="fab fa-creative-commons"></i>
      <i class="fab fa-creative-commons-by"></i> 
      <i class="fab fa-creative-commons-nc"></i>
      [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/){target="_blank" rel="noopener noreferrer"}
    right: |
      Desarrollado con [Quarto](https://quarto.org/){target="_blank" rel="noopener noreferrer"}<br>

format:
  html:
    theme:
      - theme.scss
    toc: false
    include-in-header:
      text: |
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-3TC2GD7M1V"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-3TC2GD7M1V');
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Fuentes del tema: texto (Instrument Sans) + títulos de lectura (Big Shoulders Display) + metadatos (Space Mono). -->
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    # Riel izquierdo con nombre y cargo, en todas las páginas (en móvil pasa a cabecera).
    include-before-body:
      text: |
        <aside class="site-rail">
          <a class="rail-name" href="./index.html">Cristóbal <br>Merchan <br>Farfán</a>
          <p class="role">Bibliotecólogo · Lic. en Cs. de la Información y Documentación</p>
          <div class="now-playing" id="now-playing" hidden></div>
        </aside>
    include-after-body:
      text: |
        <script>
          /* Quarto inserta el riel dentro del contenido; se lleva al inicio de la página
             para que en móvil quede arriba del menú (en escritorio es fijo y no cambia nada). */
          (function() {
            var riel = document.querySelector('.site-rail');
            if (riel) document.body.prepend(riel);
          })();
        </script>
        <script>
          /* Spotify: qué estoy escuchando. Lo responde la función de Netlify
             (netlify/functions/now-playing.mjs). Fuera de Netlify (GitHub Pages,
             vista previa local) la función no existe y el widget sigue oculto. */
          (function() {
            var caja = document.getElementById('now-playing');
            if (!caja || !window.fetch) return;
            function el(tag, cls, texto) {
              var n = document.createElement(tag);
              if (cls) n.className = cls;
              if (texto) n.textContent = texto;
              return n;
            }
            function pintar(d) {
              if (!d || !d.title) { caja.hidden = true; return; }
              var esSpotify = /^https:\/\/open\.spotify\.com\//.test(d.url || '');
              var link = el(esSpotify ? 'a' : 'div', 'np-link');
              if (esSpotify) { link.href = d.url; link.target = '_blank'; link.rel = 'noopener'; }
              if (/^https:\/\/i\.scdn\.co\//.test(d.cover || '')) {
                var img = el('img', 'np-cover'); img.src = d.cover; img.alt = ''; link.appendChild(img);
              }
              var txt = el('span', 'np-text');
              txt.appendChild(el('span', 'np-title', d.title));
              txt.appendChild(el('span', 'np-artist', d.artist));
              link.appendChild(txt);
              var etiqueta = el('span', 'np-label' + (d.playing ? ' np-label--on' : ''),
                                d.playing ? 'Escuchando ahora' : 'Lo último que escuché');
              caja.replaceChildren(etiqueta, link);
              caja.hidden = false;
            }
            function cargar() {
              fetch('/.netlify/functions/now-playing')
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(pintar)
                .catch(function() { caja.hidden = true; });
            }
            cargar();
            setInterval(function() { if (!document.hidden) cargar(); }, 60000);
          })();
        </script>
        <script>
          (function() {
            const opciones = ['a', 'x', 'o', '_'];
            let indice = 0;
            const tituloElement = document.querySelector('.navbar-brand');
            if (!tituloElement) return;
            const textoBase = 'Bienvenid';
            tituloElement.textContent = textoBase + '_';
            setInterval(() => {
              tituloElement.textContent = textoBase + opciones[indice % opciones.length];
              indice++;
            }, 800);
          })();
        </script>